name: Java CI Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile all Java sources
        run: |
          mkdir -p out
          # 编译 madeJava/fileVarious/ 下所有 .java 文件 与 test/test.java
          javac -d out -cp madeJava/fileVarious \
            $(find madeJava -name "*.java") \
            test/test.java

      - name: Run tests
        run: |
          # 假设测试主类名为 Test 且位于默认包，请根据实际类名修改
          java -cp out Test
